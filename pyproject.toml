[project]
name = "Zk-FedEval"
version = "0.1.0"
description = "Flower and EZKL privacy-preserving evaluation PoC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ezkl==23.0.5",
    "flwr-datasets[vision]>=0.5.0",
    "flwr[simulation]==1.35.0",
    "numpy",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "psutil",
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zk_fedeval"]

[tool.flwr.app]
publisher = "zk-fedeval"

[tool.flwr.app.components]
serverapp = "zk_fedeval.server_app:app"
clientapp = "zk_fedeval.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
local-epochs = 1
batch-size = 4
learning-rate = 0.1
fraction-train = 1.0
fraction-evaluate = 0.0
min-train-nodes = 2
min-evaluate-nodes = 0
min-available-nodes = 2
seed = 2026
partition-alpha = 0.5
partition-seed = 2026
scenario = "all-pass"
save-model = false


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
